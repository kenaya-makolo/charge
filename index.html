<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YEBELA</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EEF2;--card:#fff;--ink:#12202C;--mut:#546574;--line:#CFDAE2;--acc:#7C3AED;--on:#fff;--u:#C2410C;--i:#B7791F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D151C;--card:#16212B;--ink:#E6EEF4;--mut:#93A4B2;--line:#263543;--acc:#3DDC97;--on:#06251A;--u:#FB923C;--i:#F6C453;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D151C;--card:#16212B;--ink:#E6EEF4;--mut:#93A4B2;--line:#263543;--acc:#3DDC97;--on:#06251A;--u:#FB923C;--i:#F6C453;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:8px 0}
h2{margin:0 0 8px}
.sub{color:var(--mut);margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:5px 0}
button{cursor:pointer}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--on);font-weight:600;margin-top:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;color:var(--mut);font-weight:600}
.seg .on{background:var(--acc);color:var(--on)}
header{display:flex;justify-content:space-between;align-items:center}
.hb button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;margin-left:6px}
.gauge{display:flex;align-items:center;gap:14px}
#pct{font-size:36px;font-weight:800;min-width:92px;transition:color .6s}
.batw{position:relative;flex:1;padding-right:10px}
.batw:after{content:"";position:absolute;right:0;top:22px;width:8px;height:24px;background:var(--ink);border-radius:0 4px 4px 0}
.bat{position:relative;height:68px;border:3px solid var(--ink);border-radius:16px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--acc);transition:width .6s cubic-bezier(.3,1.3,.5,1),background-color .6s}
ul{list-style:none;padding:0;margin:0}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.i-u{border-left-color:var(--u)}.i-i{border-left-color:var(--i)}
.task input{width:22px;height:22px;margin:0;accent-color:var(--acc);flex:none}
.tb{flex:1;min-width:0}.tb b{display:block;overflow-wrap:anywhere}
.done b{text-decoration:line-through;color:var(--mut)}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin:4px 4px 0 0;color:var(--mut)}
.task a,.task button{border:0;background:none;font-size:18px;text-decoration:none;padding:4px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:20}
#toast button{border:0;border-radius:8px;padding:6px 10px;background:var(--acc);color:var(--on);font-weight:600}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
#modal .card{width:100%;max-width:420px}
.err{color:var(--u);min-height:1.2em;margin:4px 0}
.note textarea{resize:vertical}
.note button{border:0;background:none;color:var(--mut);text-decoration:underline;padding:4px 0}
.empty{color:var(--mut);padding:18px;text-align:center}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.set input[type=time]{width:auto}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>

<!-- ===== Écran de connexion ===== -->
<main id="auth" class="wrap">
  <h1>yebela</h1>
  <p class="sub">Vos tâches, vos rappels, votre énergie du jour.</p>
  <div class="card">
    <div class="seg"><button data-m="login" class="on">Se connecter</button><button data-m="signup">S’inscrire</button></div>
    <input id="em" type="email" placeholder="Adresse e-mail" autocomplete="email" aria-label="Adresse e-mail">
    <input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password" aria-label="Mot de passe">
    <p id="err" class="err"></p>
    <button id="go" class="btn">Se connecter</button>
    <button id="gg" class="btn ghost">Continuer avec Google</button>
  </div>
</main>

<!-- ===== Application ===== -->
<div id="app" class="wrap" hidden>
  <header><h1>yebela</h1><div class="hb"><button id="th">Thème</button><button id="out">Quitter</button></div></header>
  <section class="card">
    <div class="gauge"><span id="pct">0 %</span><div class="batw"><div class="bat"><div class="fill" id="fill"></div></div></div></div>
    <p id="cnt" class="sub"></p>
  </section>
  <nav class="seg"><button data-t="tasks" class="on">Tâches</button><button data-t="notes">Notes</button><button data-t="set">Réglages</button></nav>

  <section id="v-tasks">
    <div class="card">
      <input id="tt" placeholder="Nouvelle tâche" aria-label="Nouvelle tâche">
      <div class="row">
        <select id="imp" aria-label="Importance"><option value="n">Normale</option><option value="i">Importante</option><option value="u">Urgente</option></select>
        <select id="rem" aria-label="Type de rappel"><option value="notif">Notification</option><option value="ring">Sonnerie</option><option value="none">Aucun rappel</option></select>
      </div>
      <input id="due" type="datetime-local" aria-label="Date et heure du rappel">
      <button id="add" class="btn">Ajouter la tâche</button>
      <button id="cancel" class="btn ghost" hidden>Annuler la modification</button>
    </div>
    <div class="seg"><button data-f="all" class="on">Toutes</button><button data-f="todo">À faire</button><button data-f="done">Faites</button></div>
    <ul id="list"></ul>
  </section>

  <section id="v-notes" hidden>
    <button id="nn" class="btn">Nouvelle note</button>
    <div id="nl"></div>
  </section>

  <section id="v-set" class="card set" hidden>
    <h2>Réglages</h2>
    <label>Rappel quotidien « Quelles tâches aujourd’hui ? » <input id="dl" type="checkbox"></label>
    <label>Heure du rappel <input id="dt" type="time"></label>
    <button id="nb" class="btn ghost">Autoriser les notifications</button>
    <button id="sb" class="btn ghost">Tester la sonnerie</button>
    <p class="sub">Les rappels sonnent tant que cette page reste ouverte. Compte : <span id="who"></span></p>
  </section>
</div>

<div id="modal" hidden>
  <div class="card">
    <h2>Quelles tâches pour aujourd’hui ?</h2>
    <input id="mt" placeholder="Une tâche à faire aujourd’hui" aria-label="Tâche du jour">
    <button id="ma" class="btn">Ajouter</button>
    <button id="mc" class="btn ghost">Fermer, rien de plus</button>
  </div>
</div>
<div id="toast" hidden></div>

<script>
// ===== Outils =====
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const mem={};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IMP={n:"Normale",i:"Importante",u:"Urgente"};
let user=null,data=null,mode="login",filter="all",ringT=null,actx=null;
const save=()=>LS.set("td:"+user,data);
const today=()=>new Date().toLocaleDateString("sv-SE");
async function hash(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(unescape(encodeURIComponent(p)))}}

// ===== Message, notification, sonnerie =====
function toast(msg,stop){const t=$("#toast");t.textContent=msg;if(stop){const b=document.createElement("button");b.textContent="Arrêter";b.onclick=()=>{stopRing();t.hidden=true};t.append(b)}t.hidden=false;clearTimeout(toast.t);if(!stop)toast.t=setTimeout(()=>t.hidden=true,3500)}
function notify(t,b){try{if("Notification" in window&&Notification.permission==="granted")new Notification(t,{body:b})}catch(e){}}
function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.25)}catch(e){}}
function ring(){stopRing();beep();ringT=setInterval(beep,600);setTimeout(stopRing,30000)}
function stopRing(){clearInterval(ringT);ringT=null}

// ===== Compte (stocké dans ce navigateur) =====
$$("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$("[data-m]").forEach(x=>x.classList.toggle("on",x===b));$("#go").textContent=b.textContent;$("#err").textContent=""});
$("#go").onclick=async()=>{
  const e=$("#em").value.trim().toLowerCase(),p=$("#pw").value,er=$("#err");
  if(!/^\S+@\S+\.\S+$/.test(e))return er.textContent="Entrez une adresse e-mail valide.";
  if(p.length<6)return er.textContent="Le mot de passe doit contenir au moins 6 caractères.";
  const users=LS.get("users",{}),h=await hash(p);
  if(mode==="signup"){if(users[e])return er.textContent="Un compte existe déjà avec cette adresse. Connectez-vous.";users[e]=h;LS.set("users",users)}
  else if(users[e]!==h)return er.textContent="E-mail ou mot de passe incorrect.";
  LS.set("session",e);start(e)};
$("#gg").onclick=()=>toast("La connexion Google demande un serveur : elle arrive en phase 2 du parcours.");
$("#out").onclick=()=>{LS.set("session",null);stopRing();user=null;$("#app").hidden=true;$("#auth").hidden=false;$("#pw").value=""};
function start(e){user=e;data=LS.get("td:"+e,{tasks:[],notes:[],set:{daily:true,time:"08:00",ask:""}});$("#auth").hidden=true;$("#app").hidden=false;$("#who").textContent=e;$("#dl").checked=data.set.daily;$("#dt").value=data.set.time;endEdit();render();renderNotes();tick()}

// ===== Tâches =====
function gcal(t){const s=new Date(t.due),e=new Date(s.getTime()+18e5),f=d=>d.toISOString().replace(/[-:]|\.\d{3}/g,"");return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t.t)+"&dates="+f(s)+"/"+f(e)}
$("#imp").onchange=()=>$("#rem").value=$("#imp").value==="u"?"ring":"notif";
function addTask(title,imp,rem,due){data.tasks.unshift({id:Date.now(),t:title,imp,rem,due,done:false,fired:false});save();render()}
let editId=null;
function endEdit(){editId=null;$("#tt").value="";$("#due").value="";$("#imp").value="n";$("#rem").value="notif";$("#add").textContent="Ajouter la tâche";$("#cancel").hidden=true}
$("#add").onclick=()=>{const t=$("#tt").value.trim();if(!t)return toast("Écrivez d’abord le nom de la tâche.");
  if(editId){const x=data.tasks.find(k=>k.id===editId);if(x){x.t=t;x.imp=$("#imp").value;x.rem=$("#rem").value;if(x.due!==$("#due").value)x.fired=false;x.due=$("#due").value;save();render();toast("Tâche modifiée.")}endEdit()}
  else{addTask(t,$("#imp").value,$("#rem").value,$("#due").value);$("#tt").value="";$("#due").value=""}};
$("#cancel").onclick=endEdit;
$("#tt").onkeydown=e=>{if(e.key==="Enter")$("#add").click()};
function render(){
  const T=data.tasks,d=T.filter(x=>x.done).length,p=T.length?Math.round(d/T.length*100):0;
  $("#fill").style.width=p+"%";$("#pct").textContent=p+" %";
  const c=T.length&&p<40?`hsl(${Math.round(35*p/40)} 85% 50%)`:"";$("#fill").style.backgroundColor=c;$("#pct").style.color=c;
  $("#cnt").textContent=T.length?d+(d>1?" tâches faites":" tâche faite")+" sur "+T.length:"Ajoutez une première tâche pour commencer à charger.";
  const L=T.filter(x=>filter==="all"||(filter==="todo")!==x.done).sort((a,b)=>a.done-b.done||"uin".indexOf(a.imp)-"uin".indexOf(b.imp));
  $("#list").innerHTML=L.length?L.map(x=>`<li class="task ${x.done?"done":""} i-${x.imp}"><input type="checkbox" data-c="${x.id}" ${x.done?"checked":""} aria-label="Marquer comme faite"><div class="tb"><b>${esc(x.t)}</b><span class="chip">${IMP[x.imp]}</span>${x.due?`<span class="chip">${new Date(x.due).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}</span>`:""}${x.rem==="ring"?`<span class="chip">Sonnerie</span>`:x.rem==="notif"?`<span class="chip">Notification</span>`:""}</div>${x.due?`<a href="${esc(gcal(x))}" target="_blank" rel="noopener" title="Ajouter à Google Agenda" aria-label="Ajouter à Google Agenda">📅</a>`:""}<button data-e="${x.id}" aria-label="Modifier" title="Modifier">✏️</button><button data-x="${x.id}" aria-label="Supprimer">✕</button></li>`).join(""):`<li class="empty">Rien ici pour l’instant.</li>`}
$("#list").onclick=ev=>{const c=ev.target.dataset;
  if(c.c){const t=data.tasks.find(x=>x.id==c.c);t.done=ev.target.checked;if(t.done)toast("Bien joué, la charge monte.")}
  else if(c.e){const x=data.tasks.find(k=>k.id==c.e);editId=x.id;$("#tt").value=x.t;$("#imp").value=x.imp;$("#rem").value=x.rem;$("#due").value=x.due||"";$("#add").textContent="Enregistrer les modifications";$("#cancel").hidden=false;$("#tt").focus();scrollTo({top:0,behavior:"smooth"});return}
  else if(c.x){data.tasks=data.tasks.filter(x=>x.id!=c.x);if(editId==c.x)endEdit()}else return;
  save();render()};
$$("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;$$("[data-f]").forEach(x=>x.classList.toggle("on",x===b));render()});
$$("[data-t]").forEach(b=>b.onclick=()=>{$$("[data-t]").forEach(x=>x.classList.toggle("on",x===b));["tasks","notes","set"].forEach(k=>$("#v-"+k).hidden=k!==b.dataset.t)});

// ===== Notes =====
function renderNotes(){$("#nl").innerHTML=data.notes.map(n=>`<div class="card note"><textarea data-n="${n.id}" rows="4" placeholder="Écrivez ici…" aria-label="Note">${esc(n.t)}</textarea><button data-d="${n.id}">Supprimer la note</button></div>`).join("")||`<p class="sub">Aucune note pour l’instant.</p>`}
$("#nn").onclick=()=>{data.notes.unshift({id:Date.now(),t:""});save();renderNotes()};
$("#nl").oninput=ev=>{const n=data.notes.find(x=>x.id==ev.target.dataset.n);if(n){n.t=ev.target.value;save()}};
$("#nl").onclick=ev=>{const id=ev.target.dataset.d;if(id){data.notes=data.notes.filter(x=>x.id!=id);save();renderNotes()}};

// ===== Réglages et rappel quotidien =====
$("#dl").onchange=()=>{data.set.daily=$("#dl").checked;save()};
$("#dt").onchange=()=>{data.set.time=$("#dt").value;data.set.ask="";save()};
$("#nb").onclick=()=>{try{Notification.requestPermission().then(p=>toast(p==="granted"?"Notifications activées.":"Notifications non autorisées sur cet appareil."))}catch(e){toast("Notifications indisponibles dans ce navigateur.")}};
$("#sb").onclick=()=>{ring();toast("Sonnerie de test",true)};
$("#ma").onclick=()=>{const t=$("#mt").value.trim();if(!t)return;addTask(t,"n","notif","");$("#mt").value="";toast("Tâche ajoutée. Une autre ?")};
$("#mt").onkeydown=e=>{if(e.key==="Enter")$("#ma").click()};
$("#mc").onclick=()=>{$("#modal").hidden=true};

// ===== Vérification toutes les 15 secondes =====
function tick(){
  if(!user)return;const now=new Date();let ch=false;
  data.tasks.forEach(t=>{if(!t.done&&!t.fired&&t.due&&t.rem!=="none"&&new Date(t.due)<=now){t.fired=true;ch=true;notify("Rappel",t.t);if(t.rem==="ring"){ring();toast("Rappel : "+t.t,true)}else toast("Rappel : "+t.t)}});
  const hm=now.toTimeString().slice(0,5),td=today();
  if(data.set.daily&&data.set.ask!==td&&hm>=data.set.time){data.set.ask=td;ch=true;notify("Charge","Quelles tâches pour aujourd’hui ?");$("#modal").hidden=false}
  if(ch){save();render()}}
setInterval(tick,15000);

// ===== Thème =====
const th=LS.get("theme",null);if(th)document.documentElement.dataset.theme=th;
$("#th").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";LS.set("theme",r.dataset.theme)};

// ===== Reconnexion automatique =====
const s=LS.get("session",null);if(s)start(s);
</script>
</body>
</html>
